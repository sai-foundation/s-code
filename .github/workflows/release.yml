name: Community source release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: community-source-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny,cargo-audit,cargo-about
      - name: Install source-build runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Require an approved public source tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          manifest = Path('Cargo.toml').read_text()
          workspace = re.search(r'(?ms)^\[workspace\.package\]\s*(.*?)(?=^\[|\Z)', manifest)
          cargo_version = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', workspace.group(1) if workspace else '')
          if cargo_version is None:
              raise SystemExit('Cargo.toml has no workspace version')
          tag = os.environ['RELEASE_TAG']
          if tag != f"v{cargo_version.group(1)}":
              raise SystemExit('source release tag must exactly match the Cargo workspace version')
          contract = json.loads(Path('community-release.json').read_text())
          if contract['schema_version'] != 2:
              raise SystemExit('unsupported Community source release contract schema')
          if contract['repository_identity']['publication_enabled'] is not True:
              raise SystemExit('public source release is disabled by community-release.json')
          if contract['source_release']['strategy'] != 'git_tag_and_github_source_archives':
              raise SystemExit('Community release contract is not source-first')
          for field in (
              'prebuilt_artifacts_enabled',
              'binary_installer_enabled',
              'automatic_updater_enabled',
              'crates_io_publication_enabled',
          ):
              if contract['source_release'][field] is not False:
                  raise SystemExit(f'source-first release requires {field}=false')
          if os.environ['REPOSITORY_VISIBILITY'] != 'public':
              raise SystemExit('public source release requires a public downstream repository')
          PY
      - run: scripts/verify-community.sh

  publish-source-release:
    needs: validate-source-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the existing reviewed source tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Opencoding Community $VERSION" \
            --generate-notes
