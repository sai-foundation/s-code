name: Community release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version written into release metadata
        required: true
        default: v0.1.0-rc.1
        type: string
      sign_macos:
        description: Use configured Apple signing and notarization credentials
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      publish: ${{ steps.policy.outputs.publish }}
      sign_macos: ${{ steps.policy.outputs.sign_macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate candidate or fail-closed public release
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SIGN_MACOS: ${{ inputs.sign_macos }}
          TAG_VERSION: ${{ github.ref_name }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          manifest = Path('Cargo.toml').read_text()
          workspace = re.search(r'(?ms)^\[workspace\.package\]\s*(.*?)(?=^\[|\Z)', manifest)
          cargo_version = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', workspace.group(1) if workspace else '')
          if cargo_version is None:
              raise SystemExit('Cargo.toml has no workspace version')
          if os.environ['EVENT_NAME'] == 'push':
              version = os.environ['TAG_VERSION']
              if version != f"v{cargo_version.group(1)}":
                  raise SystemExit('release tag must exactly match the Cargo workspace version')
              contract = json.loads(Path('community-release.json').read_text())
              if contract['repository_identity']['publication_enabled'] is not True:
                  raise SystemExit('public release is disabled by community-release.json')
              if os.environ['REPOSITORY_VISIBILITY'] != 'public':
                  raise SystemExit('public release requires a public downstream repository')
              publish = 'true'
              sign_macos = 'true'
          else:
              version = os.environ['INPUT_VERSION']
              candidate = re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-rc\.([1-9]\d*)', version)
              if candidate is None:
                  raise SystemExit('candidate version must look like v0.1.0-rc.1')
              if '.'.join(candidate.groups()[:3]) != cargo_version.group(1):
                  raise SystemExit('candidate version must match the Cargo workspace version')
              publish = 'false'
              sign_macos = os.environ['INPUT_SIGN_MACOS'].lower()
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
              output.write(f'publish={publish}\n')
              output.write(f'sign_macos={sign_macos}\n')
          PY

  build:
    needs: [validate, third-party-licenses]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: third-party-licenses
      - run: cargo build --locked --release --target '${{ matrix.target }}' -p opencoding-daemon -p opencoding-cli
      - name: Build controlled Linux runner
        if: runner.os == 'Linux'
        run: cargo build --locked --release --target '${{ matrix.target }}' -p opencoding-linux-runner
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && needs.validate.outputs.sign_macos == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12"
          security create-keychain -p temporary build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temporary build.keychain
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary build.keychain
          identity="$(security find-identity -v -p codesigning build.keychain | awk 'NR==1 {print $2}')"
          test -n "$identity"
          for binary in opencoding-daemon opencoding-cli; do
            codesign --force --options runtime --timestamp --sign "$identity" \
              "target/${{ matrix.target }}/release/$binary"
            codesign --verify --strict --verbose=2 \
              "target/${{ matrix.target }}/release/$binary"
          done
      - name: Notarize macOS executables
        if: runner.os == 'macOS' && needs.validate.outputs.sign_macos == 'true'
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$APPLE_NOTARY_KEY"
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
          umask 077
          printf '%s' "$APPLE_NOTARY_KEY" > notary-api-key.p8
          mkdir notarization
          cp "target/${{ matrix.target }}/release/opencoding-daemon" notarization/
          cp "target/${{ matrix.target }}/release/opencoding-cli" notarization/
          ditto -c -k --sequesterRsrc notarization notarization.zip
          xcrun notarytool submit notarization.zip \
            --key notary-api-key.p8 \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > notarization-result.json
          status="$(plutil -extract status raw -o - notarization-result.json)"
          test "$status" = "Accepted"
      - name: Package candidate archive
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/opencoding-daemon" package/
          cp "target/${{ matrix.target }}/release/opencoding-cli" package/
          cp scripts/opencoding package/opencoding
          chmod 0755 package/opencoding
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp "target/${{ matrix.target }}/release/opencoding-linux-runner" package/
          fi
          cp scripts/update.sh package/opencoding-update
          chmod 0755 package/opencoding-update
          cp LICENSE NOTICE README.md SECURITY.md THIRD_PARTY_LICENSES.html package/
          tar -C package -czf "opencoding-${{ matrix.target }}.tar.gz" .
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: opencoding-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencoding-${{ matrix.target }}
          path: opencoding-${{ matrix.target }}.tar.gz

  third-party-licenses:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-about
      - run: cargo about generate about.hbs > THIRD_PARTY_LICENSES.html
      - run: test -s THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html

  assemble:
    needs: [build, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: opencoding-*
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: third-party-licenses
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create release metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
          MACOS_CODE_SIGNED: ${{ needs.validate.outputs.sign_macos }}
          PUBLICATION: ${{ needs.validate.outputs.publish }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("RELEASE.json").write_text(json.dumps({
              "schema_version": 1,
              "version": os.environ["VERSION"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "publication": os.environ["PUBLICATION"] == "true",
              "macos_code_signed": os.environ["MACOS_CODE_SIGNED"] == "true",
          }, indent=2, sort_keys=True) + "\n")
          PY
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: opencoding-source.spdx.json
      - name: Create in-toto candidate provenance
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          MACOS_CODE_SIGNED: ${{ needs.validate.outputs.sign_macos }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          subjects = []
          for path in sorted(Path('.').glob('opencoding-*.tar.gz')) + [
              Path('opencoding-source.spdx.json'),
              Path('THIRD_PARTY_LICENSES.html'),
              Path('RELEASE.json'),
          ]:
              subjects.append({
                  'name': path.name,
                  'digest': {'sha256': hashlib.sha256(path.read_bytes()).hexdigest()},
              })
          statement = {
              '_type': 'https://in-toto.io/Statement/v1',
              'subject': subjects,
              'predicateType': 'https://slsa.dev/provenance/v1',
              'predicate': {
                  'buildDefinition': {
                      'buildType': 'https://actions.github.io/buildtypes/workflow/v1',
                      'externalParameters': {
                          'version': os.environ['VERSION'],
                          'macos_code_signed': os.environ['MACOS_CODE_SIGNED'] == 'true',
                      },
                      'internalParameters': {},
                      'resolvedDependencies': [{
                          'uri': f"git+https://github.com/{os.environ['REPOSITORY']}@{os.environ['GITHUB_REF_VALUE']}",
                          'digest': {'gitCommit': os.environ['SOURCE_REVISION']},
                      }],
                  },
                  'runDetails': {
                      'builder': {'id': f"https://github.com/{os.environ['WORKFLOW_REF']}"},
                      'metadata': {
                          'invocationId': f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}"
                      },
                      'byproducts': [],
                  },
              },
          }
          Path('opencoding-provenance.intoto.jsonl').write_text(
              json.dumps(statement, separators=(',', ':'), sort_keys=True) + '\n'
          )
          PY
      - run: |
          sha256sum opencoding-*.tar.gz opencoding-source.spdx.json \
            opencoding-provenance.intoto.jsonl THIRD_PARTY_LICENSES.html \
            RELEASE.json > SHA256SUMS
      - run: cosign sign-blob --yes SHA256SUMS --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-release-candidate-${{ needs.validate.outputs.version }}
          path: |
            opencoding-*.tar.gz
            opencoding-source.spdx.json
            opencoding-provenance.intoto.jsonl
            THIRD_PARTY_LICENSES.html
            RELEASE.json
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem

  publish:
    if: needs.validate.outputs.publish == 'true'
    needs: [assemble, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: community-release-candidate-${{ needs.validate.outputs.version }}
      - name: Publish the existing reviewed tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Opencoding Community $VERSION" \
            --generate-notes \
            opencoding-*.tar.gz \
            opencoding-source.spdx.json \
            opencoding-provenance.intoto.jsonl \
            THIRD_PARTY_LICENSES.html \
            RELEASE.json SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem
