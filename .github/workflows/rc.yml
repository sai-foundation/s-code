name: Community candidate evidence

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged promotion pull request number for recovery
        required: true
        type: number
      qualification_run_id:
        description: Successful Community CI run ID for recovery
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: community-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bind-qualified-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve the merged promotion and successful qualification run
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PULL_REQUEST: ${{ inputs.pull_request }}
          INPUT_QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pull_request="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | first | .number // empty')"
            test -n "$pull_request"
            head_revision="$(gh pr view "$pull_request" --repo "$GITHUB_REPOSITORY" \
              --json headRefOid --jq .headRefOid)"
            qualification_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml --event pull_request --commit "$head_revision" \
              --status completed --limit 20 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty')"
          else
            pull_request="$INPUT_PULL_REQUEST"
            qualification_run_id="$INPUT_QUALIFICATION_RUN_ID"
            head_revision="$(gh pr view "$pull_request" --repo "$GITHUB_REPOSITORY" \
              --json headRefOid --jq .headRefOid)"
          fi
          test -n "$pull_request"
          test -n "$head_revision"
          test -n "$qualification_run_id"
          pull_request_state="$(gh pr view "$pull_request" --repo "$GITHUB_REPOSITORY" \
            --json baseRefName,state --jq '[.baseRefName, .state] | @tsv')"
          test "$pull_request_state" = "$(printf 'main\tMERGED')"
          run_state="$(gh run view "$qualification_run_id" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,event,headSha \
            --jq '[.conclusion, .event, .headSha] | @tsv')"
          test "$run_state" = "$(printf 'success\tpull_request\t%s' "$head_revision")"
          {
            echo "pull_request=$pull_request"
            echo "head_revision=$head_revision"
            echo "qualification_run_id=$qualification_run_id"
          } >>"$GITHUB_OUTPUT"
      - name: Download qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ steps.qualification.outputs.qualification_run_id }}
        run: |
          gh run download "$QUALIFICATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name community-qualification-evidence \
            --dir "$RUNNER_TEMP/qualification"
      - name: Prove main has the exact tree that passed Community CI
        env:
          PULL_REQUEST: ${{ steps.qualification.outputs.pull_request }}
          HEAD_REVISION: ${{ steps.qualification.outputs.head_revision }}
        run: |
          python3 scripts/community-candidate.py finalize \
            --qualification "$RUNNER_TEMP/qualification/community-qualification.json" \
            --output "$RUNNER_TEMP/community-release-ready.json" \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-revision "$GITHUB_SHA" \
            --pull-request "$PULL_REQUEST" \
            --expected-head-revision "$HEAD_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-release-ready-${{ github.sha }}
          path: ${{ runner.temp }}/community-release-ready.json
          retention-days: 90
