name: Community CI

on:
  pull_request:

permissions:
  contents: read

env:
  # Dependabot scans every lockfile. Keep pull-request checks independent from
  # the npm audit service; release-candidate verification remains fail closed.
  OPENCODING_SKIP_NETWORK_AUDIT: "1"

concurrency:
  group: community-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify Developer Certificate of Origin sign-offs
        run: |
          python3 scripts/check-dco.py \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.event.pull_request.head.sha }}'

  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/ci-cache/target
      OPENCODING_SHARED_TEST_TMPDIR: ${{ github.workspace }}/.work/ci-policy/tmp
      OPENCODING_SHARED_NPM_CACHE: ${{ github.workspace }}/.work/npm-cache
      npm_config_cache: ${{ github.workspace }}/.work/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/benchmarks/runner/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          workspaces: . -> .work/ci-cache/target
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-about@0.9.2
      - run: scripts/verify-community.sh policy

  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/ci-cache/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          workspaces: . -> .work/ci-cache/target
      - name: Install Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: scripts/verify-community.sh rust

  web-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODING_SHARED_NPM_CACHE: ${{ github.workspace }}/.work/npm-cache
      npm_config_cache: ${{ github.workspace }}/.work/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs-site/package-lock.json
      - run: scripts/verify-community.sh web

  source-gate:
    if: always()
    needs: [source-policy, rust-linux, web-docs, cli-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source-gate component
        env:
          SOURCE_POLICY_RESULT: ${{ needs.source-policy.result }}
          RUST_LINUX_RESULT: ${{ needs.rust-linux.result }}
          WEB_DOCS_RESULT: ${{ needs.web-docs.result }}
          CLI_E2E_RESULT: ${{ needs.cli-e2e.result }}
        run: |
          for result in \
            "$SOURCE_POLICY_RESULT" \
            "$RUST_LINUX_RESULT" \
            "$WEB_DOCS_RESULT" \
            "$CLI_E2E_RESULT"
          do
            test "$result" = success
          done

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/ci-cache/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          workspaces: . -> .work/ci-cache/target
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  cli-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/ci-cache/target
      OPENCODING_SHARED_TEST_TMPDIR: ${{ github.workspace }}/.work/ci-runtime/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          workspaces: . -> .work/ci-cache/target
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: tests/test-cli-e2e.sh
      - run: tests/test-first-run.sh
      - run: tests/test-privacy-security-use-cases.sh

  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: clients/vscode
      - run: npm run check
        working-directory: clients/vscode
      - run: xvfb-run -a npm run test:extension
        working-directory: clients/vscode

  jetbrains:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: gradle -p clients/jetbrains test

  qualification-evidence:
    needs: [dco, source-gate, rust-platforms, cli-e2e, vscode, jetbrains]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind successful checks to the tested source and Git tree
        run: |
          python3 scripts/community-candidate.py qualify \
            --output "$RUNNER_TEMP/community-qualification.json" \
            --repository "$GITHUB_REPOSITORY" \
            --tested-revision "$GITHUB_SHA" \
            --pull-request '${{ github.event.pull_request.number }}' \
            --pull-request-head '${{ github.event.pull_request.head.sha }}' \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --check dco \
            --check source-gate \
            --check rust-platforms \
            --check cli-e2e \
            --check vscode \
            --check jetbrains
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-qualification-evidence
          path: ${{ runner.temp }}/community-qualification.json
          retention-days: 30

  javascript-codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
