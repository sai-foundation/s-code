name: S-Code CI

on:
  pull_request:
  workflow_call:
    inputs:
      full:
        description: Run the full matrix and online dependency audits
        type: boolean
        default: false

permissions:
  contents: read

# Cancel superseded PR runs. Full scheduled/manual runs have their own group.
concurrency:
  group: s-code-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.work/ci-cache/target
  S_CODE_SHARED_TEST_TMPDIR: ${{ github.workspace }}/.work/ci-runtime/tmp
  S_CODE_SHARED_NPM_CACHE: ${{ github.workspace }}/.work/npm-cache
  npm_config_cache: ${{ github.workspace }}/.work/npm-cache

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      web: ${{ steps.plan.outputs.web }}
      docs: ${{ steps.plan.outputs.docs }}
      vscode: ${{ steps.plan.outputs.vscode }}
      jetbrains: ${{ steps.plan.outputs.jetbrains }}
      benchmarks: ${{ steps.plan.outputs.benchmarks }}
      codeql: ${{ steps.plan.outputs.codeql }}
      rust: ${{ steps.plan.outputs.rust }}
      policy: ${{ steps.plan.outputs.policy }}
      protocol: ${{ steps.plan.outputs.protocol }}
      runtime: ${{ steps.plan.outputs.runtime }}
      install: ${{ steps.plan.outputs.install }}
      privacy: ${{ steps.plan.outputs.privacy }}
      audit: ${{ steps.plan.outputs.audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected checks
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL: ${{ inputs.full && 'true' || 'false' }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--full); else args+=(--base "$BASE" --head "$HEAD"); fi
          if [ "$PUBLIC" = true ]; then args+=(--public); fi
          python3 scripts/ci-plan.py plan "${args[@]}" --output "$GITHUB_OUTPUT"
      - name: Check source boundary, secrets, links and CI regressions
        run: |
          python3 scripts/check-community-tree.py
          python3 scripts/check-community-secrets.py --history
          python3 scripts/check-doc-links.py
          tests/test-dco.sh
          tests/test-ci-workflow.sh
          tests/test-community-candidate.sh
          python3 tests/test-verification.py
      - name: Validate GitHub Actions syntax and expressions
        if: steps.plan.outputs.workflow == 'true'
        run: |
          tool="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tool/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$tool/actionlint.tar.gz" -C "$tool" actionlint
          "$tool/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: Verify contribution sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check-dco.py --base "$BASE" --head "$HEAD"
          --repository "$REPOSITORY" --pull-request "$PR_NUMBER"

  linux:
    needs: checks
    if: needs.checks.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          workspaces: . -> .work/ci-cache/target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.checks.outputs.runtime == 'true' || needs.checks.outputs.install == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux sandbox backend
        if: needs.checks.outputs.rust == 'true' || needs.checks.outputs.runtime == 'true' || needs.checks.outputs.install == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Format and lint Rust once
        if: needs.checks.outputs.rust == 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        if: needs.checks.outputs.policy == 'true'
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-about@0.9.2
      - name: Dependency and license policy
        if: needs.checks.outputs.policy == 'true'
        run: |
          cargo deny check
          cargo about generate about.hbs > "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
          test -s "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
          grep -q '>serde 1\.' "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
          grep -q 'MIT License' "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
          tests/test-supply-chain.sh
      - name: Generated protocol and SDK consistency
        if: needs.checks.outputs.protocol == 'true'
        run: tests/test-protocol-bindings.sh
      - name: Rust tests including platform security controls
        if: needs.checks.outputs.rust == 'true'
        run: cargo test --locked --workspace
      - name: CLI end-to-end
        if: needs.checks.outputs.runtime == 'true'
        run: tests/test-cli-e2e.sh
      - name: First run with development binaries
        if: needs.checks.outputs.runtime == 'true' && needs.checks.outputs.install != 'true'
        run: tests/test-first-run.sh
      - name: Actual release installation and first run
        if: needs.checks.outputs.install == 'true'
        run: |
          tests/test-source-install.sh
          tests/test-source-install-real.sh
      - name: Full privacy evidence
        if: needs.checks.outputs.privacy == 'true'
        run: tests/test-privacy-security-use-cases.sh

  macos:
    needs: checks
    if: needs.checks.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          workspaces: . -> .work/ci-cache/target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.checks.outputs.runtime == 'true' || needs.checks.outputs.install == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust tests including platform security controls
        if: needs.checks.outputs.rust == 'true'
        run: cargo test --locked --workspace
      - name: Full macOS-specific lint coverage
        if: inputs.full
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: CLI end-to-end
        if: needs.checks.outputs.runtime == 'true'
        run: tests/test-cli-e2e.sh
      - name: First run with development binaries
        if: needs.checks.outputs.runtime == 'true' && needs.checks.outputs.install != 'true'
        run: tests/test-first-run.sh
      - name: Actual release installation and first run
        if: needs.checks.outputs.install == 'true'
        run: |
          tests/test-source-install.sh
          tests/test-source-install-real.sh
      - name: Full privacy evidence
        if: needs.checks.outputs.privacy == 'true'
        run: tests/test-privacy-security-use-cases.sh

  windows:
    needs: checks
    if: needs.checks.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
          workspaces: . -> .work/ci-cache/target
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  web:
    needs: checks
    if: needs.checks.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: tests/test-web-build.sh
      - if: needs.checks.outputs.audit == 'true'
        run: npm audit --prefix web --audit-level=high

  docs:
    needs: checks
    if: needs.checks.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S_CODE_SKIP_NETWORK_AUDIT: ${{ needs.checks.outputs.audit == 'true' && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: tests/test-community-docs-site.sh

  vscode:
    needs: checks
    if: needs.checks.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - run: npm ci --prefix clients/vscode --no-audit --no-fund
      - run: npm run check --prefix clients/vscode
      - run: xvfb-run -a npm run test:extension --prefix clients/vscode
      - if: needs.checks.outputs.audit == 'true'
        run: npm audit --prefix clients/vscode --audit-level=high

  jetbrains:
    needs: checks
    if: needs.checks.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.1.0'
      - run: gradle -p clients/jetbrains test buildPlugin
      - if: inputs.full
        run: gradle -p clients/jetbrains verifyPlugin

  benchmarks:
    needs: checks
    if: needs.checks.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/benchmarks/runner/package-lock.json
      - run: npm ci --prefix tests/benchmarks/runner --no-audit --no-fund
      - run: python3 tests/test-harness-benchmark.py validate
      - run: tests/test-harness-grader-integrity.sh
      - run: python3 tests/benchmarks/harness/test_run.py
      - run: python3 tests/benchmarks/harness/test_evaluate_experience.py
      - run: python3 tests/benchmarks/harness/test_transfer_tasks.py
      - if: needs.checks.outputs.audit == 'true'
        run: npm audit --prefix tests/benchmarks/runner --audit-level=high

  codeql:
    needs: checks
    if: needs.checks.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  source-gate:
    name: source-gate
    if: always()
    needs: [checks, linux, macos, windows, web, docs, vscode, jetbrains, benchmarks, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exactly the selected checks
        env:
          PLAN: ${{ needs.checks.outputs.plan }}
          RESULTS: ${{ toJSON(needs) }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
          FULL: ${{ inputs.full && 'true' || 'false' }}
        run: |
          args=()
          if [ "$PUBLIC" = true ]; then args+=(--public); fi
          if [ "$FULL" = true ]; then args+=(--full); fi
          python3 scripts/ci-plan.py gate --plan "$PLAN" --needs "$RESULTS" "${args[@]}"
