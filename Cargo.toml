[workspace]
resolver = "2"
members = ["crates/agent-adapter", "crates/agent-core", "crates/api-server", "crates/audit", "crates/cli", "crates/compliance", "crates/config", "crates/connector-sdk", "crates/context-engine", "crates/daemon", "crates/evals", "crates/execution", "crates/git-automation", "crates/identity", "crates/linux-runner", "crates/mcp-client", "crates/model-gateway", "crates/platform-runtime", "crates/policy", "crates/protocol", "crates/storage", "crates/tool-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.89"

[profile.dev]
debug = 1
split-debuginfo = "off"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
aes-gcm = { version = "0.10", features = ["std"] }
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "json", "chrono", "migrate", "macros"] }
thiserror = "2"
toml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
ts-rs = { version = "12", features = ["chrono-impl", "no-serde-warnings", "serde-json-impl"] }
http-body-util = "0.1"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
shell-words = "1"
futures-util = "0.3"
getrandom = "0.3"
ignore = "0.4"
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
jsonschema = { version = "0.49.2", default-features = false }
url = "2"
unicode-width = "0.2"
zeroize = "1"
