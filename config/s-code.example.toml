schema_version = 1
profile = "development"

[daemon]
listen = "127.0.0.1:4096"
# The default database is ~/.s-code/state/s-code.db. Override it only
# when a dedicated state location is required.

[client]
daemon_url = "http://127.0.0.1:4096"
organization_id = "org_local"
team_id = "team_local"
actor_id = "user_local"
model = "deepseek/deepseek-v4-flash"

[model]
# Optional read-only JavaScript orchestration; direct tools remain available.
code_mode = false
# The default development model API is http://127.0.0.1:18787/v1.
# Provider credentials belong to that independent process, not this file.
# auto selects a model-family format; lines, text and patch force one format.
editing_mode = "auto"
# editing_overrides = { "my-model" = "text" }

[mcp]
enabled = false
