<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">Historical efficiency comparison: S-Code and Other Agent A</title>
  <desc id="desc">Durable Task Queue, GLM 5.3, August 31 2026. Three runs per agent, all passing. Median reported tokens: S-Code 121904, Other Agent A 186791, a 34.7 percent reduction. Median seconds: S-Code 46.741, Other Agent A 50.020, a 6.6 percent reduction. Each metric has a shared zero baseline. These are historical development-build results and reported token accounting differs; Results describe one historical task, not a general speed ranking or billing comparison. S-Code had the slower worst run.</desc>
  <rect x="1" y="1" width="1098" height="248" rx="20" fill="#0d1011" stroke="#2c393a"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="42" fill="#d3dcdf" font-size="20">Durable Task Queue · GLM 5.3</text>
    <rect x="858" y="18" width="210" height="36" rx="18" fill="#15362e"/>
    <text x="963" y="42" text-anchor="middle" fill="#9cebd5" font-size="18" font-weight="700">Both passed 3/3</text>
    <path d="M551 70v150" stroke="#2b383e"/>

    <text x="32" y="105" fill="#9cebd5" font-size="42" font-weight="700">34.7%</text>
    <text x="186" y="102" fill="#edf0e8" font-size="18">fewer reported tokens</text>
    <text x="32" y="158" fill="#e4eee8" font-size="18">S-Code</text>
    <rect x="166" y="141" width="182.734286" height="24" rx="4" fill="#78d6b8"/>
    <text x="514" y="159" text-anchor="end" fill="#e4eee8" font-size="18">121,904</text>
    <text x="32" y="211" fill="#b2bfc3" font-size="18">Other Agent A</text>
    <rect x="166" y="194" width="280" height="24" rx="4" fill="#647780"/>
    <text x="514" y="212" text-anchor="end" fill="#b2bfc3" font-size="18">186,791</text>

    <text x="583" y="105" fill="#9cebd5" font-size="42" font-weight="700">6.6%</text>
    <text x="716" y="102" fill="#edf0e8" font-size="18">less median time</text>
    <text x="583" y="158" fill="#e4eee8" font-size="18">S-Code</text>
    <rect x="716" y="141" width="233.611555" height="24" rx="4" fill="#78d6b8"/>
    <text x="1068" y="159" text-anchor="end" fill="#e4eee8" font-size="18">46.741s</text>
    <text x="583" y="211" fill="#b2bfc3" font-size="18">Other Agent A</text>
    <rect x="716" y="194" width="250" height="24" rx="4" fill="#647780"/>
    <text x="1068" y="212" text-anchor="end" fill="#b2bfc3" font-size="18">50.020s</text>
  </g>
</svg>
