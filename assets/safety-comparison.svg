<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">S-Code: secret-file protection built into file and command tools</title>
  <desc id="desc">A request to read .env.production is denied by S-Code's built-in file and command tools. Local CLI comparison reviewed September 9, 2026: S-Code includes sensitive-path denies; Codex has a built-in OS sandbox and configurable deny rules; Claude Code offers sandbox and credential rules to configure; OpenCode denies .env in the read tool but recommends an external sandbox for command isolation. This compares documented controls, not security scores.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101a19"/>
      <stop offset="1" stop-color="#0c1014"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1098" height="398" rx="20" fill="url(#background)" stroke="#2c393a"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="34" fill="#8ee4ce" font-size="12" font-weight="700" letter-spacing="2">SAFE / PROTECT YOUR CREDENTIALS</text>
    <text x="32" y="73" fill="#f3f1e9" font-size="30" font-weight="700">Secret files stay out of built-in tools.</text>
    <text x="32" y="101" fill="#b2bfc3" font-size="16">Known sensitive paths are blocked without writing project-specific deny rules.</text>

    <rect x="32" y="126" width="330" height="66" rx="10" fill="#171f27" stroke="#34424b"/>
    <text x="52" y="151" fill="#a7b5bd" font-size="12" letter-spacing="1">A TASK TRIES TO READ A SECRET</text>
    <text x="52" y="178" fill="#f1eee3" font-size="21" font-family="Menlo, Consolas, monospace">cat .env.production</text>
    <path d="M374 159h55m-8-6 8 6-8 6" fill="none" stroke="#82999e" stroke-width="2"/>

    <rect x="444" y="126" width="314" height="66" rx="10" fill="#13362e" stroke="#69c5ad"/>
    <path d="M469 143l15 5v12c0 10-15 17-15 17s-15-7-15-17v-12z" fill="none" stroke="#9cebd5" stroke-width="2"/>
    <path d="m463 159 4 4 8-9" fill="none" stroke="#9cebd5" stroke-width="2"/>
    <text x="499" y="153" fill="#9cebd5" font-size="19" font-weight="700">S-Code denies the read</text>
    <text x="499" y="177" fill="#c3d9d1" font-size="14">File tools + sandboxed commands</text>
    <path d="M772 159h43" fill="none" stroke="#728389" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="m825 153 12 12m0-12-12 12" stroke="#e4b398" stroke-width="2"/>
    <text x="855" y="154" fill="#f1eee3" font-size="17" font-weight="700">No file contents</text>
    <text x="855" y="179" fill="#b2bfc3" font-size="15">returned to the model</text>

    <path d="M32 215h1036" stroke="#2b383e"/>
    <text x="32" y="241" fill="#b2bfc3" font-size="12" font-weight="700" letter-spacing="1.1">HOW LOCAL CLI PROTECTION IS PROVIDED</text>
    <rect x="32" y="256" width="242" height="92" rx="10" fill="#15332c" stroke="#448b76"/>
    <text x="48" y="282" fill="#9cebd5" font-size="19" font-weight="700">S-Code</text>
    <text x="48" y="307" fill="#f3f1e9" font-size="17">Built-in sensitive-path deny</text>
    <text x="48" y="332" fill="#b2c9c1" font-size="15">File + command protection</text>
    <text x="302" y="282" fill="#f3f1e9" font-size="19" font-weight="700">Codex</text>
    <text x="302" y="307" fill="#d4dde0" font-size="17">Add file deny rules</text>
    <text x="302" y="332" fill="#9fadb5" font-size="15">OS sandbox built in</text>
    <path d="M552 266v73" stroke="#2b383e"/>
    <text x="580" y="282" fill="#f3f1e9" font-size="19" font-weight="700">Claude Code</text>
    <text x="580" y="307" fill="#d4dde0" font-size="17">Configure credential rules</text>
    <text x="580" y="332" fill="#9fadb5" font-size="15">Enable Bash sandbox</text>
    <path d="M825 266v73" stroke="#2b383e"/>
    <text x="853" y="282" fill="#f3f1e9" font-size="19" font-weight="700">OpenCode</text>
    <text x="853" y="307" fill="#d4dde0" font-size="17">Read tool denies .env</text>
    <text x="853" y="332" fill="#9fadb5" font-size="15">External sandbox for shell</text>
    <text x="32" y="378" fill="#95a6ad" font-size="12">Documentation comparison · 09 Sep 2026 · Configurations change behavior · Scope, sources and S-Code tests linked below</text>
  </g>
</svg>
