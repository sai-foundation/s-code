<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 900 930" role="img" aria-labelledby="title desc">
  <title id="title">Opencoding Community benchmark comparison with OpenCode</title>
  <desc id="desc">On the same GLM 5.3 model and external grader, Community is 6.6 percent faster with 34.7 percent fewer tokens on Durable Task Queue, and 44.4 percent faster with 63.3 percent fewer tokens on Dependency Flow Runner.</desc>
  <defs>
    <linearGradient id="community" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19c37d"/>
      <stop offset="1" stop-color="#61e7c7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1d2c"/>
      <stop offset="1" stop-color="#091724"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#02070d" flood-opacity=".4"/>
    </filter>
    <style>
      .headline{font:800 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3ebdd}
      .eyebrow{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px;fill:#61e7c7}
      .task{font:750 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3ebdd}
      .meta{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9fb2bf}
      .metric{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.4px;fill:#c4d1d7}
      .series{font:650 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dce7e8}
      .value{font:750 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f3ebdd}
      .win{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.5px;fill:#07111f}
      .foot{font:550 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#91a6b3}
      .icon{fill:none;stroke:#61e7c7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="900" height="930" rx="30" fill="#07111f"/>
  <circle cx="808" cy="90" r="142" fill="#0b302c" opacity=".35"/>
  <circle cx="82" cy="861" r="150" fill="#0a2632" opacity=".52"/>

  <text class="eyebrow" x="50" y="56">FROZEN TASKS · SAME MODEL · SAME GRADER</text>
  <text class="headline" x="50" y="103">Less time. Far less model work.</text>
  <g transform="translate(592 47)">
    <circle cx="8" cy="8" r="7" fill="#27d893"/>
    <text class="meta" x="23" y="13">Community</text>
    <circle cx="128" cy="8" r="7" fill="#506270"/>
    <text class="meta" x="143" y="13">OpenCode</text>
  </g>

  <g transform="translate(30 140)" filter="url(#shadow)">
    <rect width="840" height="350" rx="24" fill="url(#panel)" stroke="#1c3c4d"/>
    <text class="eyebrow" x="38" y="48">TASK 01</text>
    <text class="task" x="38" y="83">Durable Task Queue</text>
    <text class="meta" x="38" y="110">Median of 3 passing runs</text>
    <g transform="translate(665 30)">
      <rect width="139" height="38" rx="19" fill="#61e7c7"/>
      <text class="win" x="69.5" y="25" text-anchor="middle">6.6% FASTER</text>
    </g>

    <g transform="translate(38 142)">
      <g class="icon" transform="translate(0 4)">
        <circle cx="15" cy="15" r="13"/>
        <path d="M15 8v8l6 4"/>
      </g>
      <text class="metric" x="44" y="20">LATENCY</text>
      <text class="series" x="44" y="56">Community</text>
      <rect x="143" y="40" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="40" width="374" height="20" rx="10" fill="url(#community)"/>
      <text class="value" x="565" y="56">46.741s</text>
      <text class="series" x="44" y="89" fill="#94a6b1">OpenCode</text>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#506270"/>
      <text class="value" x="565" y="89" fill="#b9c6cc">50.020s</text>
    </g>

    <g transform="translate(38 253)">
      <g class="icon" transform="translate(0 1)">
        <path d="M7 5h17l7 11-7 11H7L0 16z"/>
        <circle cx="15.5" cy="16" r="4"/>
      </g>
      <text class="metric" x="44" y="20">TOKENS</text>
      <text class="series" x="44" y="56">Community</text>
      <rect x="143" y="40" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="40" width="261" height="20" rx="10" fill="url(#community)"/>
      <text class="value" x="565" y="56">121,904</text>
      <text class="series" x="44" y="89" fill="#94a6b1">OpenCode</text>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#506270"/>
      <text class="value" x="565" y="89" fill="#b9c6cc">186,791</text>
      <g transform="translate(644 35)">
        <rect width="158" height="38" rx="19" fill="#13382f" stroke="#2b9d72"/>
        <text class="eyebrow" x="79" y="25" text-anchor="middle" font-size="11">34.7% FEWER</text>
      </g>
    </g>
  </g>

  <g transform="translate(30 515)" filter="url(#shadow)">
    <rect width="840" height="350" rx="24" fill="url(#panel)" stroke="#1c3c4d"/>
    <text class="eyebrow" x="38" y="48">TASK 02</text>
    <text class="task" x="38" y="83">Dependency Flow Runner</text>
    <text class="meta" x="38" y="110">Current completed comparison</text>
    <g transform="translate(648 30)">
      <rect width="156" height="38" rx="19" fill="#61e7c7"/>
      <text class="win" x="78" y="25" text-anchor="middle">44.4% FASTER</text>
    </g>

    <g transform="translate(38 142)">
      <g class="icon" transform="translate(0 4)">
        <circle cx="15" cy="15" r="13"/>
        <path d="M15 8v8l6 4"/>
      </g>
      <text class="metric" x="44" y="20">LATENCY</text>
      <text class="series" x="44" y="56">Community</text>
      <rect x="143" y="40" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="40" width="222" height="20" rx="10" fill="url(#community)"/>
      <text class="value" x="565" y="56">58.820s</text>
      <text class="series" x="44" y="89" fill="#94a6b1">OpenCode</text>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#506270"/>
      <text class="value" x="565" y="89" fill="#b9c6cc">105.875s</text>
    </g>

    <g transform="translate(38 253)">
      <g class="icon" transform="translate(0 1)">
        <path d="M7 5h17l7 11-7 11H7L0 16z"/>
        <circle cx="15.5" cy="16" r="4"/>
      </g>
      <text class="metric" x="44" y="20">TOKENS</text>
      <text class="series" x="44" y="56">Community</text>
      <rect x="143" y="40" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="40" width="147" height="20" rx="10" fill="url(#community)"/>
      <text class="value" x="565" y="56">128,873</text>
      <text class="series" x="44" y="89" fill="#94a6b1">OpenCode</text>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#172a38"/>
      <rect x="143" y="73" width="400" height="20" rx="10" fill="#506270"/>
      <text class="value" x="565" y="89" fill="#b9c6cc">351,329</text>
      <g transform="translate(644 35)">
        <rect width="158" height="38" rx="19" fill="#13382f" stroke="#2b9d72"/>
        <text class="eyebrow" x="79" y="25" text-anchor="middle" font-size="11">63.3% FEWER</text>
      </g>
    </g>
  </g>

  <text class="foot" x="450" y="902" text-anchor="middle">z-ai/glm-5.3 · frozen repositories · same external grader · completed runs</text>
</svg>
