<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1060" viewBox="0 0 800 1060" role="img" aria-labelledby="title desc">
  <title id="title">S-Code privacy boundary</title>
  <desc id="desc">A protected local execution and persistence plane uses command sandboxing, network isolation, secret redaction, browser credential isolation, encrypted local state, and optional metadata-only central audit. Selected context crosses to the configured model provider.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2030"/>
      <stop offset="1" stop-color="#091724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#61e7c7"/>
      <stop offset="1" stop-color="#19c37d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .headline{font:800 31px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3ebdd}
      .eyebrow{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px;fill:#61e7c7}
      .core{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3ebdd}
      .title{font:750 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3ebdd}
      .copy{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a3b6c1}
      .small{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cce9df}
      .icon{fill:none;stroke:#07111f;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="800" height="1060" rx="30" fill="#07111f"/>
  <circle cx="726" cy="116" r="190" fill="#0b302c" opacity=".34"/>
  <circle cx="50" cy="990" r="180" fill="#0a2632" opacity=".5"/>
  <text class="eyebrow" x="40" y="49">PRIVACY IS AN EXECUTION BOUNDARY</text>
  <text class="headline" x="40" y="91">Harness execution and persistence stay local.</text>

  <g transform="translate(40 128)">
    <rect width="720" height="290" rx="28" fill="url(#surface)" stroke="#267259" stroke-width="2" stroke-dasharray="8 7"/>
    <text class="small" x="24" y="36">AUTHORIZED LOCAL BOUNDARY</text>
    <g transform="translate(286 43)" filter="url(#glow)">
      <circle cx="74" cy="74" r="72" fill="#0d4637" opacity=".55"/>
      <circle cx="74" cy="74" r="55" fill="url(#accent)"/>
      <g class="icon" transform="translate(48 41)">
        <rect x="2" y="24" width="50" height="40" rx="8"/>
        <path d="M12 24v-9a15 15 0 0 1 30 0v9M27 38v13"/>
      </g>
    </g>
    <text class="core" x="360" y="218" text-anchor="middle">Community execution plane</text>
    <text class="copy" x="360" y="247" text-anchor="middle">agent · tools · policy · approvals · storage</text>
    <g transform="translate(132 262)">
      <circle cx="7" cy="7" r="7" fill="#19c37d"/>
      <text class="small" x="22" y="12">Tools run locally</text>
      <circle cx="249" cy="7" r="7" fill="#19c37d"/>
      <text class="small" x="264" y="12">Writes stay scoped</text>
      <circle cx="475" cy="7" r="7" fill="#19c37d"/>
      <text class="small" x="490" y="12">Context → your model</text>
    </g>
  </g>

  <g transform="translate(40 452)">
    <g>
      <rect width="345" height="164" rx="21" fill="url(#surface)" stroke="#1d3b4c"/>
      <rect x="18" y="18" width="48" height="48" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(28 28)">
        <rect x="2" y="3" width="31" height="29" rx="4"/><path d="m8 13 5 5-5 5M17 24h9"/>
      </g>
      <text class="title" x="82" y="39">Command sandbox</text>
      <text class="copy" x="18" y="92">Seatbelt on macOS.</text>
      <text class="copy" x="18" y="117">Linux sandbox profiles.</text>
      <text class="small" x="18" y="145">READ-ONLY OR WORKSPACE-WRITE</text>
    </g>
    <g transform="translate(375)">
      <rect width="345" height="164" rx="21" fill="url(#surface)" stroke="#1d3b4c"/>
      <rect x="18" y="18" width="48" height="48" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(28 28)">
        <circle cx="18" cy="18" r="15"/><path d="M5 18h26M18 3a24 24 0 0 1 0 30M18 3a24 24 0 0 0 0 30M5 5l26 26"/>
      </g>
      <text class="title" x="82" y="39">Network off</text>
      <text class="copy" x="18" y="92">Commands start offline.</text>
      <text class="copy" x="18" y="117">Access is separately governed.</text>
      <text class="small" x="18" y="145">DENY BY DEFAULT</text>
    </g>
  </g>

  <g transform="translate(40 640)">
    <g>
      <rect width="345" height="164" rx="21" fill="url(#surface)" stroke="#1d3b4c"/>
      <rect x="18" y="18" width="48" height="48" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(28 28)">
        <path d="M3 8h30v22H3zM8 14h10M8 20h17M8 26h12M4 33 32 3"/>
      </g>
      <text class="title" x="82" y="39">Secret protection</text>
      <text class="copy" x="18" y="92">Sensitive paths are blocked.</text>
      <text class="copy" x="18" y="117">Credential-shaped output is redacted.</text>
      <text class="small" x="18" y="145">BEFORE PUBLICATION</text>
    </g>
    <g transform="translate(375)">
      <rect width="345" height="164" rx="21" fill="url(#surface)" stroke="#1d3b4c"/>
      <rect x="18" y="18" width="48" height="48" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(28 28)">
        <rect x="2" y="4" width="32" height="27" rx="4"/><path d="M2 11h32M12 35h12M18 31v4M23 20a5 5 0 1 1-10 0"/>
      </g>
      <text class="title" x="82" y="39">Browser isolation</text>
      <text class="copy" x="18" y="92">One-time bootstrap.</text>
      <text class="copy" x="18" y="117">HttpOnly · SameSite=Strict.</text>
      <text class="small" x="18" y="145">NO KEYS IN JAVASCRIPT</text>
    </g>
  </g>

  <g transform="translate(40 828)">
    <g>
      <rect width="345" height="164" rx="21" fill="url(#surface)" stroke="#1d3b4c"/>
      <rect x="18" y="18" width="48" height="48" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(28 27)">
        <ellipse cx="18" cy="8" rx="15" ry="6"/><path d="M3 8v20c0 4 7 7 15 7s15-3 15-7V8M3 18c0 4 7 7 15 7s15-3 15-7"/>
      </g>
      <text class="title" x="82" y="39">Private local state</text>
      <text class="copy" x="18" y="92">Permission-restricted database.</text>
      <text class="copy" x="18" y="117">Sensitive session content encrypted.</text>
      <text class="small" x="18" y="145">SYMLINKS REJECTED</text>
    </g>
    <g transform="translate(375)">
      <rect width="345" height="164" rx="21" fill="url(#surface)" stroke="#1d3b4c"/>
      <rect x="18" y="18" width="48" height="48" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(28 27)">
        <path d="M4 3h28v34H4zM10 11h16M10 18h16M10 25h8"/><circle cx="27" cy="29" r="6"/>
      </g>
      <text class="title" x="82" y="39">Optional central export</text>
      <text class="copy" x="18" y="92">Metadata-only when enabled.</text>
      <text class="copy" x="18" y="117">Local audit content is encrypted.</text>
      <text class="small" x="18" y="145">EXPLICIT CONTENT POLICY</text>
    </g>
  </g>

  <text class="copy" x="400" y="1030" text-anchor="middle">Isolation is part of the normal path — not a prompt asking the model to behave.</text>
</svg>
