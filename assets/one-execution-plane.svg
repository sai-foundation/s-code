<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
  <title id="title">One Opencoding Community execution plane</title>
  <desc id="desc">An OpenAI-compatible model endpoint connects to one protected Community execution service shared by the CLI, Local Web, and IDE clients.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e2030"/><stop offset="1" stop-color="#091724"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#61e7c7"/><stop offset="1" stop-color="#19c37d"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3aa67f"/></marker>
    <style>
      .headline{font:800 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3ebdd}
      .eyebrow{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1.8px;fill:#61e7c7}
      .title{font:750 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3ebdd}
      .copy{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a3b6c1}
      .small{font:650 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cce9df}
      .icon{fill:none;stroke:#07111f;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#3aa67f;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="800" height="760" rx="30" fill="#07111f"/>
  <circle cx="720" cy="75" r="175" fill="#0b302c" opacity=".32"/>
  <text class="eyebrow" x="40" y="48">ONE LOOP · EVERY CLIENT</text>
  <text class="headline" x="40" y="89">No duplicate state. No split-brain agent.</text>

  <g transform="translate(195 124)">
    <rect width="410" height="118" rx="23" fill="url(#surface)" stroke="#1d3b4c"/>
    <rect x="24" y="24" width="66" height="66" rx="18" fill="#173444"/>
    <g transform="translate(39 39)" fill="none" stroke="#61e7c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="16"/><path d="M3 18h30M18 2a26 26 0 0 1 0 32M18 2a26 26 0 0 0 0 32"/>
    </g>
    <text class="eyebrow" x="112" y="41">MODEL ENDPOINT</text>
    <text class="title" x="112" y="69">OpenAI-compatible API</text>
    <text class="copy" x="112" y="94">Provider credential stays here</text>
  </g>
  <path class="flow" d="M400 247v63"/>

  <g transform="translate(100 318)">
    <rect width="600" height="190" rx="28" fill="url(#surface)" stroke="#3aa67f" stroke-width="2"/>
    <rect x="32" y="40" width="92" height="92" rx="27" fill="url(#accent)"/>
    <g class="icon" transform="translate(55 59)">
      <path d="M4 14h42v34H4zM11 22l7 7-7 7M24 38h14"/><path d="M15 14V8h20v6"/>
    </g>
    <text class="eyebrow" x="154" y="54">COMMUNITY EXECUTION PLANE</text>
    <text class="title" x="154" y="86">Agent · tools · policy · approvals</text>
    <text class="copy" x="154" y="118">Sessions, audit and persistence share one source of truth.</text>
    <g transform="translate(154 142)">
      <rect width="123" height="29" rx="14.5" fill="#10362d"/><text class="small" x="61.5" y="19" text-anchor="middle">sandboxed</text>
      <rect x="133" width="126" height="29" rx="14.5" fill="#10362d"/><text class="small" x="196" y="19" text-anchor="middle">revision-safe</text>
      <rect x="269" width="128" height="29" rx="14.5" fill="#10362d"/><text class="small" x="333" y="19" text-anchor="middle">replayable</text>
    </g>
  </g>

  <path d="M400 508v48M400 556H148v46M400 556h252v46M400 556v46" fill="none" stroke="#3aa67f" stroke-width="3"/>
  <path class="flow" d="M148 590v12"/>
  <path class="flow" d="M400 590v12"/>
  <path class="flow" d="M652 590v12"/>

  <g transform="translate(40 610)">
    <rect width="216" height="108" rx="20" fill="url(#surface)" stroke="#1d3b4c"/>
    <rect x="18" y="18" width="45" height="45" rx="13" fill="url(#accent)"/>
    <g class="icon" transform="translate(27 26)"><rect x="1" y="2" width="27" height="26" rx="3"/><path d="m6 11 5 5-5 5M15 22h8"/></g>
    <text class="title" x="78" y="44">CLI</text>
    <text class="copy" x="18" y="86">Terminal workflow</text>
  </g>
  <g transform="translate(292 610)">
    <rect width="216" height="108" rx="20" fill="url(#surface)" stroke="#1d3b4c"/>
    <rect x="18" y="18" width="45" height="45" rx="13" fill="url(#accent)"/>
    <g class="icon" transform="translate(26 27)"><rect x="1" y="1" width="29" height="23" rx="3"/><path d="M1 8h29M11 28h9M15 24v4"/></g>
    <text class="title" x="78" y="44">Local Web</text>
    <text class="copy" x="18" y="86">Thin browser client</text>
  </g>
  <g transform="translate(544 610)">
    <rect width="216" height="108" rx="20" fill="url(#surface)" stroke="#1d3b4c"/>
    <rect x="18" y="18" width="45" height="45" rx="13" fill="url(#accent)"/>
    <g class="icon" transform="translate(28 27)"><path d="M2 3h25v25H2zM8 3v25M2 10h6M13 10l4 4-4 4M21 18h5"/></g>
    <text class="title" x="78" y="44">IDE</text>
    <text class="copy" x="18" y="86">Editor context</text>
  </g>
  <text class="small" x="400" y="746" text-anchor="middle">THE SAME SESSIONS · TOOLS · APPROVALS · EVENTS</text>
</svg>
